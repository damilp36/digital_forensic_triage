[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xtriage"
version = "0.1.0"
description = "XTriage: explainable anomaly detection for digital forensic triage (SHAP + rule induction + guard + hash-chained ledger)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14",
  "scikit-learn>=1.3",
  "shap>=0.45",
  "xgboost>=2.0",
  "wittgenstein>=0.3.4",
  "lime>=0.2",
  "scipy>=1.10",
  "pyyaml>=6",
  "joblib>=1.3",
  "matplotlib>=3.7",
  "streamlit>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
xtriage = "xtriage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
